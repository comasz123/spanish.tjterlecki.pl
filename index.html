<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241A2B">
<title>Lucía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="main.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="brand">Luc<em>í</em>a</div>
    <div class="d-flex gap-1 ms-auto flex-wrap justify-content-end" role="group" aria-label="Modo">
      <button type="button" class="btn chip" data-cmd="/dialog" aria-pressed="true">diálogo</button>
      <button type="button" class="btn chip" data-cmd="/palabras_nuevas" aria-pressed="false">palabras nuevas</button>
      <button type="button" class="btn chip" data-cmd="/powtorka" aria-pressed="false">repaso</button>
      <button type="button" class="btn chip" data-cmd="/test" aria-pressed="false">test</button>
    </div>
    <div class="header-actions">
      <button type="button" class="btn icon-btn" id="voiceBtn" aria-pressed="false" title="Voz de Lucía" aria-label="Voz de Lucía">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <button type="button" class="btn icon-btn" id="logoutBtn" title="Salir" aria-label="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <footer class="app-footer">
    <div class="heard" id="heard"></div>
    <div class="composer">
      <textarea class="form-control" id="input" rows="1" placeholder="Escribe o pulsa el micro" enterkeyhint="send"></textarea>
      <button type="button" class="btn send" id="sendBtn" aria-label="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button type="button" class="btn mic" id="micBtn" data-state="idle" aria-label="Hablar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
  </footer>

  <div class="trace" id="trace"></div>
</div>

<script src="main.js"></script>
</body>
</html>
